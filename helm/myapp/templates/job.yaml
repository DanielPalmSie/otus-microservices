apiVersion: batch/v1
kind: Job
metadata:
  name: myapp-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: postgres:13
          command: ["sh", "-c", "psql -h db -U user -d mydb -f /docker-entrypoint-initdb.d/init.sql"]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: myapp-secret
                  key: db-pass
      restartPolicy: OnFailure
